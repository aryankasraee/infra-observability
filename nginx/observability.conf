# Installed as /root/nginx/conf/conf.d/observability.conf on the application host.
# Loaded inside the `http {}` block by nginx.conf's `include conf.d/*.conf`.
#
# 1. A second access log in JSON. The original combined-format access.log keeps
#    working untouched; this one exists so Grafana Alloy can parse every request
#    (status, latency, vhost) without fragile regexes.
# 2. A stub_status endpoint for nginx-prometheus-exporter. It listens only on the
#    docker0 bridge address, so it is reachable from containers but not from the
#    internet.

log_format json_obs escape=json
  '{'
    '"time":"$time_iso8601",'
    '"vhost":"$host",'
    '"server_name":"$server_name",'
    '"sni":"$ssl_server_name",'
    '"scheme":"$scheme",'
    '"remote_addr":"$remote_addr",'
    '"xff":"$http_x_forwarded_for",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":"$status",'
    '"bytes":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"'
  '}';

access_log /var/log/nginx/access_json.log json_obs;

server {
  listen 172.17.0.1:8089;
  server_name _;
  access_log off;

  location = /stub_status {
    stub_status;
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny all;
  }
}
