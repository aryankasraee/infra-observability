# Installed as /root/nginx/conf/snippets/deny-junk.conf and included in the
# server blocks of the single-page-app sites (website, admin console).
#
# Both sites are single-page apps: any unknown path falls back to index.html
# with status 200. Scanners then believe /.env, /.git/config or /wp-login.php
# exist. Nothing leaks (it is only index.html), but the 200 invites more
# probing and hides real 404s in the metrics. Answer these with a plain 404.

# Dotfiles and dot-directories, except ACME challenges.
location ~ /\.(?!well-known/) {
  return 404;
}

# Server-side script extensions this stack never serves.
location ~* \.(php\d?|phtml|asp|aspx|jsp|cgi|pl|env|ini|sql|bak|old|swp)$ {
  return 404;
}
