# Alertmanager: receives firing alerts from Prometheus, groups them, removes
# duplicates and sends notifications.
#
# Right now every notification goes to `alert-logger`, a tiny web server that
# prints each alert as one JSON line. Alloy ships that output to Loki, so all
# notifications are searchable in Grafana ({container="alert-logger"}).
# To get alerts on your phone, add a telegram/email/slack receiver here
# (see docs/ALERTS.md) and point the route at it.

route:
  receiver: logger
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: logger
      repeat_interval: 1h

receivers:
  - name: logger
    webhook_configs:
      - url: http://alert-logger:8080/alert
        send_resolved: true

inhibit_rules:
  # If the whole host is down, don't also page for every service on it.
  - source_matchers: [alertname="HostDown"]
    target_matchers: [severity=~"warning|critical"]
    equal: [server]
